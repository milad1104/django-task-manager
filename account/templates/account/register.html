<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت نام | TaskFlow</title>
</head>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Vazirmatn", sans-serif;
    background: #080b12;
    color: #f1f5f9;
}

/* =========================
   AUTH PAGE
========================= */

.auth-page {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 30px 20px;

    background:
        radial-gradient(
            circle at top right,
            rgba(99, 102, 241, 0.15),
            transparent 35%
        ),
        radial-gradient(
            circle at bottom left,
            rgba(139, 92, 246, 0.08),
            transparent 30%
        ),
        #080b12;
}

.auth-card {
    width: 100%;
    max-width: 450px;

    background: #11151f;

    border: 1px solid #202635;

    border-radius: 24px;

    padding: 40px;

    box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.45);
}

.register-card {
    max-width: 480px;
}

/* =========================
   BRAND
========================= */

.brand {
    display: flex;
    align-items: center;
    justify-content: center;

    gap: 10px;

    margin-bottom: 32px;
}

.brand-icon {
    width: 42px;
    height: 42px;

    border-radius: 12px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #6366f1;
    color: #ffffff;

    font-size: 22px;
    font-weight: 800;

    box-shadow:
        0 8px 25px rgba(99, 102, 241, 0.3);
}

.brand h1 {
    font-size: 24px;
    font-weight: 800;

    color: #f8fafc;

    direction: ltr;
}

/* =========================
   HEADER
========================= */

.auth-header {
    text-align: center;

    margin-bottom: 28px;
}

.auth-header h2 {
    font-size: 24px;
    font-weight: 800;

    color: #f8fafc;

    margin-bottom: 8px;
}

.auth-header p {
    color: #8b95a7;

    font-size: 14px;
}

/* =========================
   FORM
========================= */

.auth-form {
    display: flex;
    flex-direction: column;

    gap: 19px;
}

.input-group {
    display: flex;
    flex-direction: column;

    gap: 8px;
}

.input-group label {
    font-size: 14px;
    font-weight: 600;

    color: #cbd5e1;
}

.input-group input {
    width: 100%;
    height: 50px;

    border: 1px solid #293143;

    border-radius: 12px;

    padding: 0 15px;

    outline: none;

    font-family: inherit;
    font-size: 14px;

    color: #f1f5f9;

    background: #0c1018;

    transition: 0.2s ease;
}

.input-group input::placeholder {
    color: #5f697a;
}

.input-group input:focus {
    border-color: #6366f1;

    background: #0e131d;

    box-shadow:
        0 0 0 4px rgba(99, 102, 241, 0.12);
}

/* =========================
   OPTIONS
========================= */

.form-options {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 10px;

    font-size: 12px;
}

.form-options a,
.auth-footer a {
    color: #818cf8;

    text-decoration: none;

    font-weight: 600;
}

.form-options a:hover,
.auth-footer a:hover {
    color: #a5b4fc;
    text-decoration: underline;
}

.remember {
    display: flex;
    align-items: center;

    gap: 6px;

    color: #7f8a9d;

    cursor: pointer;
}

.remember input {
    accent-color: #6366f1;
}

/* =========================
   BUTTON
========================= */

.auth-button {
    width: 100%;
    height: 52px;

    border: none;
    border-radius: 12px;

    background: #6366f1;

    color: white;

    font-family: inherit;
    font-size: 15px;
    font-weight: 700;

    cursor: pointer;

    transition: 0.2s ease;

    margin-top: 4px;
}

.auth-button:hover {
    background: #4f46e5;

    transform: translateY(-1px);

    box-shadow:
        0 10px 25px rgba(99, 102, 241, 0.25);
}

/* =========================
   FOOTER
========================= */

.auth-footer {
    display: flex;
    justify-content: center;

    gap: 5px;

    margin-top: 26px;

    color: #7f8a9d;

    font-size: 13px;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 500px) {

    .auth-card {
        padding: 30px 22px;

        border-radius: 20px;
    }

    .auth-header h2 {
        font-size: 21px;
    }

    .form-options {
        flex-direction: column;
        align-items: flex-start;
    }

}
</style>
<body>

<div class="auth-page">

    <div class="auth-card register-card">

        <div class="brand">
            <div class="brand-icon">✓</div>
            <h1>TaskFlow</h1>
        </div>

        <div class="auth-header">
            <h2>حساب جدید بساز 🚀</h2>
            <p>برای شروع مدیریت کارهات ثبت نام کن</p>
        </div>

        <form class="auth-form">

            <div class="input-group">
                <label for="name">نام</label>
                <input
                    type="text"
                    id="name"
                    placeholder="نام خود را وارد کنید"
                >
            </div>

            <div class="input-group">
                <label for="email">ایمیل</label>
                <input
                    type="email"
                    id="email"
                    placeholder="example@email.com"
                >
            </div>

            <div class="input-group">
                <label for="password">رمز عبور</label>
                <input
                    type="password"
                    id="password"
                    placeholder="حداقل ۸ کاراکتر"
                >
            </div>

            <div class="input-group">
                <label for="confirm-password">تکرار رمز عبور</label>
                <input
                    type="password"
                    id="confirm-password"
                    placeholder="رمز عبور را دوباره وارد کنید"
                >
            </div>

            <button type="submit" class="auth-button">
                ایجاد حساب
            </button>

        </form>

        <div class="auth-footer">
            <span>قبلاً حساب ساختی؟</span>
            <a href="login.html">وارد شو</a>
        </div>

    </div>

</div>

</body>
</html>
